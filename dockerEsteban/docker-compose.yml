services:
  database:
    image: postgres:16-alpine
    container_name: cursada-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cursada_db}
      POSTGRES_USER: ${POSTGRES_USER:-cursada_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cursada_pass}
    ports:
      - "5432:5432"
    volumes:
      # Volumen nombrado: persiste los datos entre reinicios del contenedor.
      - pgdata:/var/lib/postgresql/data
      # Bind mount de solo lectura: Postgres ejecuta AUTOMÁTICAMENTE cualquier
      # .sql que encuentre en /docker-entrypoint-initdb.d/ la PRIMERA vez que
      # se crea el volumen (o sea, cuando la base de datos está vacía).
      - ./db/schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cursada_user} -d ${POSTGRES_DB:-cursada_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Servicio opcional: solo se usa si querés correr `sqlc generate` DENTRO
  # de un contenedor en lugar de tener sqlc instalado en tu máquina.
  # No es un servicio "siempre activo": se ejecuta bajo demanda con
  # `docker compose run --rm sqlc generate`.
  sqlc:
    image: sqlc/sqlc:1.31.1
    container_name: cursada-sqlc
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src
    depends_on:
      database:
        condition: service_healthy

volumes:
  pgdata:
